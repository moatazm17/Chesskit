<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Analysis - Update Required</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a {
      display: block;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.2s;
    }
    a:active { transform: scale(0.97); }
    .ios {
      background: linear-gradient(135deg, #4ecdc4, #45b7d1);
      color: white;
    }
    .android {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: white;
    }
    .features {
      margin-top: 32px;
      padding: 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .features h3 {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 12px;
    }
    .features ul {
      list-style: none;
      text-align: right;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }
    .features li {
      padding: 4px 0;
    }
    .features li::before {
      content: "✓ ";
      color: #4ecdc4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">♟️</div>
    <h1>تحديث مطلوب</h1>
    <p>فيه نسخة جديدة من التطبيق متاحة! حدّث دلوقتي عشان تستمتع بأفضل تجربة.</p>
    <div class="buttons">
      <a href="https://apps.apple.com/app/chess-analysis-review/id6740692984" class="ios">
        تحديث من App Store
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.chessreview.app" class="android">
        تحديث من Google Play
      </a>
    </div>
    <div class="features">
      <h3>الجديد في التحديث</h3>
      <ul>
        <li>أداء أسرع وتحليل محسّن</li>
        <li>ألغاز شطرنج جديدة</li>
        <li>تحسينات في الواجهة</li>
      </ul>
    </div>
  </div>
</body>
</html>

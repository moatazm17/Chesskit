<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Required</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { text-align: center; max-width: 380px; }
    .icon { font-size: 72px; margin-bottom: 20px; }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: rgba(255,255,255,0.75);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .buttons { display: flex; flex-direction: column; gap: 10px; }
    a {
      display: block;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      color: white;
    }
    a:active { opacity: 0.9; }
    .ios { background: linear-gradient(135deg, #4ecdc4, #45b7d1); }
    .android { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">♟️</div>
    <h1>Update Available</h1>
    <p>A new version is available with improved performance and new features. Please update to continue.</p>
    <div class="buttons">
      <a href="https://apps.apple.com/us/app/chess-analysis/id6751201688" class="ios">
        Update on App Store
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.m3tz.freechessanalysis" class="android">
        Update on Google Play
      </a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Analysis +</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 16px; color: #4CAF50; }
        p { font-size: 16px; line-height: 1.6; color: #ccc; margin-bottom: 24px; }
        .steps {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: right;
            margin-bottom: 24px;
        }
        .step {
            padding: 8px 0;
            font-size: 15px;
            color: #ddd;
        }
        .btn {
            display: inline-block;
            background: #4CAF50;
            color: #fff;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">♟️</div>
        <h1>مطلوب تحديث التطبيق</h1>
        <p>تم تحديث التطبيق. لاستخدام النسخة الجديدة:</p>
        <div class="steps">
            <div class="step">١. امسح تطبيق Chess Analysis + من موبايلك</div>
            <div class="step">٢. حمّله تاني من المتجر</div>
            <div class="step">٣. افتح التطبيق واستمتع!</div>
        </div>
    </div>
</body>
</html>
